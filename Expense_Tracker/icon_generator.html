<!-- Simple icon generator - Open this in browser to create icons -->
<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
</head>
<body>
    <canvas id="iconCanvas" width="192" height="192"></canvas>
    <br>
    <button onclick="downloadIcon(192)">Download 192x192 Icon</button>
    <button onclick="downloadIcon(512)">Download 512x512 Icon</button>

    <script>
        const canvas = document.getElementById('iconCanvas');
        const ctx = canvas.getContext('2d');

        // Draw the icon
        ctx.fillStyle = '#2f6fdb';
        ctx.fillRect(0, 0, 192, 192);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.beginPath();
        ctx.arc(96, 96, 60, 0, 2 * Math.PI);
        ctx.fill();

        // Clock hands
        ctx.strokeStyle = '#2f6fdb';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(96, 46);
        ctx.lineTo(96, 96);
        ctx.lineTo(120, 120);
        ctx.stroke();

        // Dollar sign lines
        ctx.fillStyle = '#2f6fdb';
        ctx.fillRect(70, 130, 52, 8);
        ctx.fillRect(80, 142, 32, 8);

        function downloadIcon(size) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = size;
            tempCanvas.height = size;
            const tempCtx = tempCanvas.getContext('2d');

            // Scale the drawing
            tempCtx.scale(size/192, size/192);
            tempCtx.fillStyle = '#2f6fdb';
            tempCtx.fillRect(0, 0, 192, 192);

            tempCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            tempCtx.beginPath();
            tempCtx.arc(96, 96, 60, 0, 2 * Math.PI);
            tempCtx.fill();

            tempCtx.strokeStyle = '#2f6fdb';
            tempCtx.lineWidth = 8;
            tempCtx.lineCap = 'round';
            tempCtx.lineJoin = 'round';
            tempCtx.beginPath();
            tempCtx.moveTo(96, 46);
            tempCtx.lineTo(96, 96);
            tempCtx.lineTo(120, 120);
            tempCtx.stroke();

            tempCtx.fillStyle = '#2f6fdb';
            tempCtx.fillRect(70, 130, 52, 8);
            tempCtx.fillRect(80, 142, 32, 8);

            const link = document.createElement('a');
            link.download = `icon-${size}.png`;
            link.href = tempCanvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
